<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق حساب Double Vitrage</title>
    <style>
        * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
        body { background-color: #f3f4f6; padding: 15px; margin: 0; }
        .container { max-width: 800px; margin: 0 auto; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 20px; }
        h1, h2 { color: #1e3a8a; margin-top: 0; }
        .form-group { margin-bottom: 12px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; color: #374151; }
        input, select { width: 100%; padding: 10px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 16px; }
        .row { display: flex; gap: 10px; }
        .row > div { flex: 1; }
        .btn { background: #2563eb; color: white; border: none; padding: 12px 20px; border-radius: 6px; font-size: 16px; cursor: pointer; width: 100%; margin-top: 10px; }
        .btn-camera { background: #059669; }
        .btn-danger { background: #dc2626; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 14px; }
        th, td { border: 1px solid #e5e7eb; padding: 8px; text-align: center; }
        th { background: #f8fafc; color: #1e293b; }
        .total-box { background: #eff6ff; border: 2px solid #2563eb; padding: 15px; border-radius: 8px; font-weight: bold; font-size: 18px; color: #1e40af; margin-top: 15px; text-align: center; }
        #imagePreview img { max-width: 100%; max-height: 250px; border-radius: 8px; margin-top: 10px; border: 1px solid #ddd; }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <h1>حاسبة الزجاج المضاعف (Double Vitrage)</h1>
        
        <!-- قسم تصوير الورقة -->
        <div class="form-group" style="background: #f0fdf4; padding: 12px; border-radius: 8px; border: 1px dashed #059669;">
            <label>📷 تصوير طلبية الورقة (أو إرفاق صورة):</label>
            <input type="file" id="orderImage" accept="image/*" capture="environment" onchange="previewFile()">
            <div id="imagePreview"></div>
        </div>

        <hr style="margin: 15px 0; border: 0; border-top: 1px solid #eee;">

        <!-- إدخال الأبعاد -->
        <div class="row">
            <div class="form-group">
                <label>العرض (سم):</label>
                <input type="number" id="width" placeholder="0">
            </div>
            <div class="form-group">
                <label>الارتفاع (سم):</label>
                <input type="number" id="height" placeholder="0">
            </div>
            <div class="form-group">
                <label>العدد:</label>
                <input type="number" id="qty" value="1" min="1">
            </div>
        </div>

        <div class="row">
            <div class="form-group">
                <label>نوع الباغيت (Baguette):</label>
                <select id="baguetteType">
                    <label>بدون باغيت</label>
                    <option value="none">بدون باغيت</option>
                    <option value="8/18">Baguette 8/18</option>
                    <option value="8/10">Baguette 8/10</option>
                </select>
            </div>
            <div class="form-group">
                <label>سعر المتر المربع (د.ج):</label>
                <input type="number" id="pricePerM2" value="4500">
            </div>
        </div>

        <button class="btn" onclick="addItem()">إضافة للطلبية</button>
    </div>

    <!-- قائمة القطع والنتائج -->
    <div class="card">
        <h2>تفاصيل الحساب</h2>
        <table id="itemsTable">
            <thead>
                <tr>
                    <th>المقاس (سم)</th>
                    <th>العدد</th>
                    <th>المساحة (م²)</th>
                    <th>الباغيت</th>
                    <th>السعر (د.ج)</th>
                    <th>حذف</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>

        <div class="total-box" id="totalDisplay">
            المجموع الإجمالي: 0.00 د.ج
        </div>
    </div>
</div>

<script>
    let items = [];

    function previewFile() {
        const preview = document.getElementById('imagePreview');
        const file = document.getElementById('orderImage').files[0];
        const reader = new FileReader();

        reader.onloadend = function () {
            preview.innerHTML = `<img src="${reader.result}" alt="صورة الطلبية">`;
        }

        if (file) {
            reader.readAsDataURL(file);
        } else {
            preview.innerHTML = "";
        }
    }

    function addItem() {
        const w = parseFloat(document.getElementById('width').value);
        const h = parseFloat(document.getElementById('height').value);
        const qty = parseInt(document.getElementById('qty').value);
        const baguette = document.getElementById('baguetteType').value;
        const priceM2 = parseFloat(document.getElementById('pricePerM2').value);

        if (!w || !h || w <= 0 || h <= 0) {
            alert('الرجاء إدخال أبعاد صحيحة');
            return;
        }

        const areaM2 = (w / 100) * (h / 100) * qty;
        const itemPrice = areaM2 * priceM2;

        items.push({ width: w, height: h, qty: qty, baguette: baguette, area: areaM2, price: itemPrice });
        updateTable();

        // إعادة ضبط الحقول
        document.getElementById('width').value = '';
        document.getElementById('height').value = '';
        document.getElementById('qty').value = '1';
    }

    function deleteItem(index) {
        items.splice(index, 1);
        updateTable();
    }

    function updateTable() {
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = '';
        let totalSum = 0;

        items.forEach((item, index) => {
            totalSum += item.price;
            tbody.innerHTML += `
                <tr>
                    <td>${item.width} × ${item.height}</td>
                    <td>${item.qty}</td>
                    <td>${item.area.toFixed(2)}</td>
                    <td>${item.baguette}</td>
                    <td>${item.price.toFixed(2)} د.ج</td>
                    <td><button class="btn btn-danger" style="padding: 4px 8px; margin:0;" onclick="deleteItem(${index})">✕</button></td>
                </tr>
            `;
        });

        document.getElementById('totalDisplay').innerText = `المجموع الإجمالي: ${totalSum.toFixed(2)} د.ج`;
    }
</script>

</body>
</html>
